name: News Bot

# Runs contrib/news-bot every 15 minutes and posts to Discord.
# Setup: add the repository secret DISCORD_WEBHOOK_URL (Settings → Secrets and
# variables → Actions). Without it every run is a no-op. See contrib/news-bot/README.md.
# Scheduled runs only fire from the repository's default branch.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Only send a test message to check the webhook"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: contrib/news-bot

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Remembers which stories were already posted between runs.
      - name: Restore bot state
        uses: actions/cache/restore@v6
        with:
          path: .news-bot-state
          key: news-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-bot-state-

      - name: Post news to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LLM_BASE_URL: ${{ secrets.NEWS_BOT_LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.NEWS_BOT_LLM_API_KEY }}
          LLM_MODEL: ${{ vars.NEWS_BOT_LLM_MODEL }}
          NEWS_BOT_EXTRA_PEOPLE: ${{ vars.NEWS_BOT_EXTRA_PEOPLE }}
          NEWS_BOT_DISABLE: ${{ vars.NEWS_BOT_DISABLE }}
          NEWS_BOT_STATE_FILE: .news-bot-state/state.json
          SEND_TEST: ${{ inputs.send_test_message }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then
            node contrib/news-bot/newsBot.mjs --test
          else
            node contrib/news-bot/newsBot.mjs --once
          fi

      - name: Save bot state
        if: always() && hashFiles('.news-bot-state/state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .news-bot-state
          key: news-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
