name: News Bot
run-name: ${{ inputs.chained && 'News Bot (every 15 min)' || 'News Bot' }}

# Runs contrib/news-bot every 15 minutes: posts to Discord and publishes the
# News Radar web app (contrib/news-bot/app) with a fresh feed.json to GitHub Pages.
# Setup: add the repository secret DISCORD_WEBHOOK_URL (Settings → Secrets and
# variables → Actions), and set Settings → Pages → Source to "GitHub Actions".
# Without the secret nothing is posted to Discord, but the app is still updated.
# GitHub starts scheduled runs of small repos only every few hours, so each run on
# the default branch also starts the next one, which first waits in the
# news-bot-timer environment: give it a 14-minute wait timer under Settings →
# Environments. The schedule stays as a backstop. See contrib/news-bot/README.md.

on:
  schedule:
    # Off the busy :00/:15/:30/:45 minutes, when GitHub is most likely to drop scheduled runs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Only send a test message to check the webhook"
        type: boolean
        default: false
      chained:
        description: "Wait in the news-bot-timer environment first (set by the previous run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs started by the previous run wait here. The environment's wait timer does the waiting,
  # so no runner is held in the meantime.
  wait:
    if: ${{ inputs.chained }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: news-bot-timer
    steps:
      - run: echo "Waited in the news-bot-timer environment."

  post-news:
    needs: wait
    if: ${{ !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time reads and saves the bot's memory.
    concurrency:
      group: news-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: contrib/news-bot

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Remembers which stories were already posted between runs.
      - name: Restore bot state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .news-bot-state
          key: news-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-bot-state-

      # A webhook saved as a variable would be ignored (and printed in these public logs).
      - name: Check the webhook is saved as a secret
        if: ${{ vars.DISCORD_WEBHOOK_URL != '' }}
        run: >-
          echo "::warning::DISCORD_WEBHOOK_URL is saved as a variable, which the bot ignores.
          Delete the variable, then add the webhook under Settings → Secrets and variables →
          Actions → Secrets → New repository secret."

      - name: Post news to Discord and update the app feed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LLM_BASE_URL: ${{ secrets.NEWS_BOT_LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.NEWS_BOT_LLM_API_KEY }}
          LLM_MODEL: ${{ vars.NEWS_BOT_LLM_MODEL }}
          NEWS_BOT_EXTRA_PEOPLE: ${{ vars.NEWS_BOT_EXTRA_PEOPLE }}
          NEWS_BOT_DISABLE: ${{ vars.NEWS_BOT_DISABLE }}
          NEWS_BOT_STATE_FILE: .news-bot-state/state.json
          NEWS_BOT_FEED_FILE: .news-bot-state/feed.json
          SEND_TEST: ${{ inputs.send_test_message }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then
            node contrib/news-bot/newsBot.mjs --test
          else
            node contrib/news-bot/newsBot.mjs --once
          fi

      - name: Save bot state
        if: always() && hashFiles('.news-bot-state/state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .news-bot-state
          key: news-bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build the web app
        if: hashFiles('.news-bot-state/feed.json') != ''
        run: |
          mkdir -p _site
          cp -R contrib/news-bot/app/. _site/
          mv _site/sw.mjs _site/sw.js
          cp .news-bot-state/feed.json _site/feed.json

      - name: Upload the web app
        if: hashFiles('_site/feed.json') != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Starts the next run, which reads the news again after the 15-minute wait. It also runs after
  # a failed cycle (a feed or Discord outage), so one bad run doesn't stop the chain.
  next-run:
    needs: post-news
    if: >-
      ${{ !cancelled() && !inputs.send_test_message &&
      (needs.post-news.result == 'success' || needs.post-news.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: news-bot-next-run
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: contrib/news-bot

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: news-bot.yml
          CHAINED: ${{ inputs.chained }}
        run: node contrib/news-bot/nextRun.mjs

  publish-app:
    needs: post-news
    if: ${{ !cancelled() && needs.post-news.result == 'success' && !inputs.send_test_message }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Posting news must not go red just because GitHub Pages is not switched on yet.
    continue-on-error: true
    concurrency:
      group: news-bot-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
